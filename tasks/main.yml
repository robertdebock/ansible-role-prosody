---
# tasks file for prosody

- name: Import assert.yml
  ansible.builtin.import_tasks:
    file: assert.yml
  run_once: true
  delegate_to: localhost

- name: Alpine - Handle init system dependencies
  when:
    - ansible_facts['os_family'] == "Alpine"
  block:
    - name: Alpine - Create machine-id if it doesn't exist
      ansible.builtin.copy:
        content: "{{ ansible_facts['machine_id'] | default('0123456789abcdef0123456789abcdef') }}"
        dest: /etc/machine-id
        mode: "0644"

    - name: Alpine - Create minimal dev service script
      ansible.builtin.copy:
        content: |
          #!/sbin/openrc-run
          depend() {
            need net
          }
          start() {
            ebegin "Starting dev service"
            eend 0
          }
          stop() {
            ebegin "Stopping dev service"
            eend 0
          }
        dest: /etc/init.d/dev
        mode: "0755"

    - name: Alpine - Ensure OpenRC runlevel directory exists
      ansible.builtin.file:
        path: /etc/runlevels/default
        state: directory
        mode: "0755"

    - name: Alpine - Add dev service to default runlevel
      ansible.builtin.file:
        src: /etc/init.d/dev
        dest: /etc/runlevels/default/dev
        state: link
      failed_when: false

- name: Install prosody
  ansible.builtin.package:
    name: "{{ prosody_packages }}"
    state: present

# The modes match what the Alpine init script enforces for the pid and log directory.
- name: Create prosody directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ prosody_user }}"
    group: "{{ prosody_group }}"
    mode: "{{ item.mode }}"
  loop:
    - path: "{{ prosody_data_directory }}"
      mode: "0755"
    - path: "{{ prosody_log_directory }}"
      mode: "{{ prosody_log_directory_mode }}"
    - path: "{{ prosody_config_directory }}/conf.d"
      mode: "0755"
    - path: "{{ prosody_pidfile | dirname }}"
      mode: "{{ prosody_pid_directory_mode }}"
  loop_control:
    label: "{{ item.path }}"

- name: Configure prosody
  ansible.builtin.template:
    src: prosody.cfg.lua.j2
    dest: "{{ prosody_config_directory }}/prosody.cfg.lua"
    owner: "{{ prosody_user }}"
    group: "{{ prosody_group }}"
    mode: "0644"
  notify:
    - Validate prosody configuration
    - Restart prosody

- name: Import ssl.yml
  ansible.builtin.import_tasks:
    file: ssl.yml
  when:
    - prosody_https_enable

- name: Import vhosts.yml
  ansible.builtin.import_tasks:
    file: vhosts.yml
  when:
    - prosody_vhosts is defined

- name: Import components.yml
  ansible.builtin.import_tasks:
    file: components.yml
  when:
    - prosody_components_enable
    - prosody_components is defined

- name: Import muc.yml
  ansible.builtin.import_tasks:
    file: muc.yml
  when:
    - prosody_muc_enable

- name: Flush handlers
  ansible.builtin.meta: flush_handlers

- name: Start and enable prosody
  ansible.builtin.service:
    name: "{{ prosody_service }}"
    state: started
    enabled: true
